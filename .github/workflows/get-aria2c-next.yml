name: Get aria2-next binary

on:
  schedule:
    # Daily probe; the cadence gate enforces the real 30-day interval.
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: 30-day cadence gate
        id: gate
        run: |
          D=$(( $(date -u +%s) / 86400 ))
          A=20741
          if [ "$D" -ge "$A" ] && [ $(( (D - A) % 30 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "cadence HIT: 30-day cycle, epoch day $D"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "cadence MISS: 30-day cycle, epoch day $D -> skipping real work"
          fi

  get-aria2-next-binary:
    needs: cadence
    if: github.event_name != 'schedule' || needs.cadence.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download Binary
        run: |
          VERSION=$(curl -s https://api.github.com/repos/AnInsomniacY/aria2-next/releases | grep 'tag_name' |  head -n 1 | awk -F\" '{print $4}' | sed 's/v//g')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          curl -fSL -o aria2-next-windows-x86_64.exe "https://github.com/AnInsomniacY/aria2-next/releases/download/v${VERSION}/aria2-next-${VERSION}-windows-x86_64.exe"
          curl -fSL -o aria2-next-linux-x86_64 "https://github.com/AnInsomniacY/aria2-next/releases/download/v${VERSION}/aria2-next-${VERSION}-linux-x86_64"

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          echo "Publishing aria2-next ${TAG}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "aria2-next ${TAG}" \
            --notes "aria2-next ${TAG} binaries, from [AnInsomniacY/aria2-next](https://github.com/AnInsomniacY/aria2-next/releases/tag/v${VERSION})." \
            aria2-next-windows-x86_64.exe \
            aria2-next-linux-x86_64
